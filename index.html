<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Battle</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1b2a3a, #0a0f14 70%);
    display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", monospace;
    color: #e6edf3; padding: 16px;
  }
  #wrap { width: min(94vw, 560px); }
  #hud {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: #0f1720; border: 1px solid #24303c; border-radius: 10px;
    padding: 10px 16px; margin-bottom: 10px;
    font-size: 14px; font-weight: 600; letter-spacing: .5px;
  }
  #hud .stat { display: flex; flex-direction: column; line-height: 1.15; min-width: 52px; }
  #hud .stat small { color: #7b8a99; font-size: 10px; letter-spacing: 1px; }
  #hud .stat b { font-size: 19px; color: #ffd76a; font-variant-numeric: tabular-nums; }
  #hud .spacer { flex: 1; }
  #mute {
    background: #1b2733; color: #e6edf3; border: 1px solid #2e3d4d;
    border-radius: 8px; width: 40px; height: 40px; cursor: pointer; font-size: 18px; line-height: 1;
  }
  #mute:hover { background: #243240; }
  #stage { position: relative; }
  canvas {
    display: block; width: 100%; height: auto;
    border: 2px solid #2e3d4d; border-radius: 10px; background: #0a0e13;
    image-rendering: pixelated;
  }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(8,12,16,.88); border-radius: 10px; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: 36px; letter-spacing: 3px; color: #ffd76a;
    text-shadow: 0 0 22px rgba(255,200,80,.45); }
  #overlay p { margin: 0; color: #9fb0c1; font-size: 14px; line-height: 1.9; }
  #overlay .keys { color: #7fe0a0; font-weight: 700; }
  #overlay button {
    background: #ffd76a; color: #141a20; border: 0; border-radius: 10px;
    padding: 12px 30px; font-size: 16px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
  }
  #overlay button:hover { background: #ffe08a; }
  #hint { text-align: center; color: #6d7c8c; font-size: 12px; margin-top: 10px; letter-spacing: .5px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="stat"><small>得分 SCORE</small><b id="score">0</b></div>
    <div class="stat"><small>关卡 LEVEL</small><b id="level">1</b></div>
    <div class="stat"><small>敌军 ENEMY</small><b id="enemies">0</b></div>
    <div class="stat"><small>生命 LIFE</small><b id="lives">3</b></div>
    <div class="spacer"></div>
    <button id="mute" title="声音开关">🔊</button>
  </div>
  <div id="stage">
    <canvas id="game" width="520" height="520"></canvas>
    <div id="overlay">
      <h1>坦克大战</h1>
      <p>守住你的基地，消灭所有来犯坦克！<br>
      移动：<span class="keys">WASD / 方向键</span>　射击：<span class="keys">空格</span><br>
      砖墙可击毁 · 钢墙不可摧毁 · 躲进树林可伏击敌人</p>
      <button id="startBtn">开始游戏</button>
    </div>
  </div>
  <div id="hint">消灭每关全部敌军即可进入下一关 · 基地被毁或生命耗尽则游戏结束</div>
</div>

<script>
(function () {
  'use strict';

  // ===== 常量 =====
  var CELL = 40, GRID = 13, W = CELL * GRID, H = CELL * GRID;
  var TANK = 34, TANK_OFF = (CELL - TANK) / 2; // 3
  var BULLET = 6, BULLET_SPEED = 6;
  var STEP = 1 / 60;

  var DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
  var DX = [0, 1, 0, -1];
  var DY = [-1, 0, 1, 0];

  var T_EMPTY = 0, T_BRICK = 1, T_STEEL = 2, T_WATER = 3, T_TREE = 4;

  // ===== 关卡地图（13×13）=====
  var LEVELS = [
    [
      ".............",
      ".#.#.#.#.#.#.",
      ".#.#.#.#.#.#.",
      ".#.#.###.#.#.",
      ".#.#.#.#.#.#.",
      ".#.#.#.#.#.#.",
      ".###.###.###.",
      ".#.#.#.#.#.#.",
      ".#.#.###.#.#.",
      ".#.#.#.#.#.#.",
      ".#.#.#.#.#.#.",
      ".....###.....",
      ".....#.#....."
    ],
    [
      ".............",
      ".#.#.@.#.@.#.",
      ".#.#.#.#.#.#.",
      ".@.#.###.#.@.",
      ".#.#.#.#.#.#.",
      ".#.~.#.#.~.#.",
      ".###.@.@.###.",
      ".#.#.#.#.#.#.",
      ".#.#.###.#.#.",
      ".#.#.#.#.#.#.",
      ".@.#.#.#.#.@.",
      ".....###.....",
      ".....#.#....."
    ],
    [
      ".............",
      ".#.#.#.#.#.#.",
      ".#.#.#.#.#.#.",
      ".#.###.###.#.",
      ".#.#.#.#.#.#.",
      ".#.~.#.#.~.#.",
      ".@.#.@.@.#.@.",
      ".#.#.#.#.#.#.",
      ".#.###.###.#.",
      ".#.#.#.#.#.#.",
      ".#.#.#.#.#.#.",
      ".....#.#.....",
      ".....#.#....."
    ]
  ];

  // ===== DOM =====
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var overlay = document.getElementById('overlay');
  var startBtn = document.getElementById('startBtn');
  var muteBtn = document.getElementById('mute');
  var scoreEl = document.getElementById('score');
  var levelEl = document.getElementById('level');
  var enemiesEl = document.getElementById('enemies');
  var livesEl = document.getElementById('lives');

  // ===== 游戏状态 =====
  var grid = [], brickHp = [];
  var BASE = { x: 6, y: 12, alive: true };
  var player = null, enemies = [], bullets = [], particles = [];
  var state = 'menu'; // menu | playing | gameover
  var score = 0, lives = 3, level = 1;
  var enemyQueue = [], spawnTimer = 0;
  var levelIntroTimer = 0, animT = 0;
  var pendingGameOver = false, gameOverTimer = 0, gameOverReason = '';
  var respawnTimer = 0;

  var ENEMY_CFG = {
    0: { speed: 1, hp: 1, color: '#9aa4ad', accent: '#c0392b', pts: 100 },
    1: { speed: 2, hp: 1, color: '#7fb069', accent: '#2f4f2f', pts: 200 },
    2: { speed: 1, hp: 2, color: '#c96b5a', accent: '#6b1f1f', pts: 300 }
  };

  // ===== 工具函数 =====
  function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
  function aabb(a, b) { return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1; }
  function tankRect(t) { return { x1: t.x, y1: t.y, x2: t.x + TANK, y2: t.y + TANK }; }

  // ===== 音效 =====
  var audioCtx = null, muted = false;
  function audio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, dur, type, vol) {
    if (muted) return; var ac = audio(); if (!ac) return;
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  }
  function noise(dur, vol) {
    if (muted) return; var ac = audio(); if (!ac) return;
    var n = Math.floor(ac.sampleRate * dur);
    var buf = ac.createBuffer(1, n, ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var src = ac.createBufferSource(); src.buffer = buf;
    var g = ac.createGain(); g.gain.value = vol || 0.12;
    src.connect(g); g.connect(ac.destination); src.start();
  }
  function sfxShoot() { beep(660, 0.08, 'square', 0.04); }
  function sfxHit() { beep(180, 0.07, 'sawtooth', 0.06); }
  function sfxExplode() { noise(0.3, 0.16); beep(120, 0.25, 'triangle', 0.1); }

  // ===== 地图加载 =====
  function loadLevel(idx) {
    var rows = LEVELS[idx];
    grid = []; brickHp = [];
    for (var y = 0; y < GRID; y++) {
      grid[y] = []; brickHp[y] = [];
      for (var x = 0; x < GRID; x++) {
        var ch = rows[y][x];
        grid[y][x] = ch === '#' ? T_BRICK : ch === '@' ? T_STEEL : ch === '~' ? T_WATER : ch === 'T' ? T_TREE : T_EMPTY;
        brickHp[y][x] = (ch === '#') ? 2 : 0;
      }
    }
  }

  function buildEnemyQueue(lv) {
    var count = Math.min(10 + (lv - 1) * 3, 30);
    var q = [];
    for (var i = 0; i < count; i++) {
      var r = Math.random(), type;
      if (lv >= 3 && r < 0.25) type = 2;
      else if (lv >= 2 && r < 0.5) type = 1;
      else type = 0;
      q.push(type);
    }
    return q;
  }

  // ===== 实体工厂 =====
  function makePlayer() {
    var p = { x: 4 * CELL + TANK_OFF, y: 12 * CELL + TANK_OFF, dir: DIR.UP, pendingDir: null };
    p.speed = 2; p.cooldown = 0; p.invuln = 0; p.alive = true; p.isPlayer = true;
    return p;
  }
  function makeEnemy(px, py, type) {
    var cfg = ENEMY_CFG[type];
    return {
      x: px, y: py, dir: DIR.DOWN, pendingDir: DIR.DOWN,
      speed: cfg.speed, hp: cfg.hp, color: cfg.color, accent: cfg.accent, pts: cfg.pts,
      type: type, cooldown: randInt(30, 60), think: randInt(40, 120),
      blocked: false, spawning: true, spawnTimer: 40, alive: true, isPlayer: false
    };
  }

  // ===== 流程控制 =====
  function resetGame() {
    score = 0; lives = 3;
    pendingGameOver = false; gameOverTimer = 0; respawnTimer = 0;
    bullets = []; particles = []; enemies = [];
  }
  function startLevel(lv) {
    level = lv;
    loadLevel((lv - 1) % LEVELS.length);
    BASE.alive = true;
    player = makePlayer();
    enemies = []; bullets = []; particles = [];
    enemyQueue = buildEnemyQueue(lv);
    spawnTimer = 0; levelIntroTimer = 90;
    pendingGameOver = false; gameOverTimer = 0; respawnTimer = 0;
    state = 'playing';
  }
  function respawnPlayer() {
    var pts = [{ x: 4, y: 12 }, { x: 8, y: 12 }];
    for (var i = 0; i < pts.length; i++) {
      var px = pts[i].x * CELL + TANK_OFF, py = pts[i].y * CELL + TANK_OFF;
      if (spawnPointFree(px, py)) {
        player.x = px; player.y = py; player.dir = DIR.UP; player.pendingDir = null;
        player.alive = true; player.invuln = 120; player.cooldown = 0;
        return;
      }
    }
    respawnTimer = 30;
  }
  function endGame(reason) {
    state = 'gameover';
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = '游戏结束';
    overlay.querySelector('p').innerHTML =
      '得分 <b style="color:#ffd76a">' + score + '</b> · 到达第 ' + level + ' 关<br>' + reason;
    startBtn.textContent = '再来一局';
  }

  // ===== 碰撞 =====
  function solidForTank(c, r) {
    if (c < 0 || r < 0 || c >= GRID || r >= GRID) return true;
    var t = grid[r][c];
    if (t === T_BRICK || t === T_STEEL || t === T_WATER) return true;
    if (BASE.alive && c === BASE.x && r === BASE.y) return true;
    return false;
  }
  function tankBlocked(nx, ny, t) {
    var c1 = Math.floor(nx / CELL), c2 = Math.floor((nx + TANK - 1) / CELL);
    var r1 = Math.floor(ny / CELL), r2 = Math.floor((ny + TANK - 1) / CELL);
    for (var r = r1; r <= r2; r++) for (var c = c1; c <= c2; c++)
      if (solidForTank(c, r)) return true;
    return false;
  }
  function tankCollidesWithTanks(nx, ny, t) {
    var r1 = { x1: nx, y1: ny, x2: nx + TANK, y2: ny + TANK };
    var list = t.isPlayer ? enemies : (player ? [player].concat(enemies) : enemies);
    for (var i = 0; i < list.length; i++) {
      var o = list[i];
      if (!o || o === t || !o.alive || o.spawning) continue;
      if (aabb(r1, tankRect(o))) return true;
    }
    return false;
  }
  function spawnPointFree(px, py) {
    var r = { x1: px, y1: py, x2: px + TANK, y2: py + TANK };
    if (player && player.alive && aabb(r, tankRect(player))) return false;
    for (var i = 0; i < enemies.length; i++)
      if (enemies[i].alive && aabb(r, tankRect(enemies[i]))) return false;
    return true;
  }
  function canTurn(tank, nd) {
    if (nd === tank.dir) return true;
    if (nd === DIR.UP || nd === DIR.DOWN) {
      if ((tank.x - TANK_OFF) % CELL !== 0) return false;
    } else {
      if ((tank.y - TANK_OFF) % CELL !== 0) return false;
    }
    var nx = tank.x + DX[nd] * tank.speed, ny = tank.y + DY[nd] * tank.speed;
    if (tankBlocked(nx, ny, tank) || tankCollidesWithTanks(nx, ny, tank)) return false;
    return true;
  }
  function moveTank(t) {
    var nx = t.x + DX[t.dir] * t.speed, ny = t.y + DY[t.dir] * t.speed;
    if (!tankBlocked(nx, ny, t) && !tankCollidesWithTanks(nx, ny, t)) {
      t.x = nx; t.y = ny; return true;
    }
    return false;
  }

  // ===== 射击与命中 =====
  function fireBullet(t) {
    var cx = t.x + TANK / 2, cy = t.y + TANK / 2, bx, by;
    if (t.dir === DIR.UP) { bx = cx - BULLET / 2; by = t.y - BULLET; }
    else if (t.dir === DIR.DOWN) { bx = cx - BULLET / 2; by = t.y + TANK; }
    else if (t.dir === DIR.LEFT) { bx = t.x - BULLET; by = cy - BULLET / 2; }
    else { bx = t.x + TANK; by = cy - BULLET / 2; }
    bullets.push({ x: bx, y: by, dir: t.dir, speed: BULLET_SPEED, owner: t.isPlayer ? 'player' : 'enemy' });
    sfxShoot();
  }

  function clearPathV(c, from, to) {
    for (var y = from + 1; y < to; y++) {
      var t = grid[y][c];
      if (t === T_BRICK || t === T_STEEL) return false;
    }
    return true;
  }
  function clearPathH(r, from, to) {
    for (var x = from + 1; x < to; x++) {
      var t = grid[r][x];
      if (t === T_BRICK || t === T_STEEL) return false;
    }
    return true;
  }
  function aimAt(tank, tx, ty) {
    var cx = Math.floor((tank.x + TANK / 2) / CELL);
    var cy = Math.floor((tank.y + TANK / 2) / CELL);
    if (tank.dir === DIR.UP && cx === tx && ty < cy) return clearPathV(cx, ty, cy);
    if (tank.dir === DIR.DOWN && cx === tx && ty > cy) return clearPathV(cx, cy, ty);
    if (tank.dir === DIR.LEFT && cy === ty && tx < cx) return clearPathH(cy, tx, cx);
    if (tank.dir === DIR.RIGHT && cy === ty && tx > cx) return clearPathH(cy, cx, tx);
    return false;
  }
  function shouldShoot(e) {
    if (player && player.alive) {
      var pcx = Math.floor((player.x + TANK / 2) / CELL);
      var pcy = Math.floor((player.y + TANK / 2) / CELL);
      if (aimAt(e, pcx, pcy)) return true;
    }
    if (BASE.alive && aimAt(e, BASE.x, BASE.y)) return true;
    return Math.random() < 0.02;
  }

  function damageBrick(c, r) {
    brickHp[r][c]--;
    if (brickHp[r][c] <= 0) grid[r][c] = T_EMPTY;
  }
  function bulletHitsTerrain(b) {
    var c1 = Math.floor(b.x / CELL), c2 = Math.floor((b.x + BULLET - 1) / CELL);
    var r1 = Math.floor(b.y / CELL), r2 = Math.floor((b.y + BULLET - 1) / CELL);
    for (var r = r1; r <= r2; r++) for (var c = c1; c <= c2; c++) {
      if (c < 0 || r < 0 || c >= GRID || r >= GRID) { b.dead = true; return true; }
      var t = grid[r][c];
      if (t === T_BRICK) { damageBrick(c, r); b.dead = true; spawnHit(b); sfxHit(); return true; }
      if (t === T_STEEL) { b.dead = true; spawnHit(b); sfxHit(); return true; }
      if (BASE.alive && c === BASE.x && r === BASE.y) {
        if (b.owner === 'enemy') destroyBase();
        b.dead = true; return true;
      }
    }
    return false;
  }
  function bulletHitsTank(b) {
    var br = { x1: b.x, y1: b.y, x2: b.x + BULLET, y2: b.y + BULLET };
    if (b.owner === 'player') {
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (!e.alive || e.spawning) continue;
        if (aabb(br, tankRect(e))) { hitEnemy(e); b.dead = true; return true; }
      }
    } else {
      if (player && player.alive && player.invuln <= 0 && aabb(br, tankRect(player))) {
        hitPlayer(); b.dead = true; return true;
      }
    }
    return false;
  }
  function bulletHitsBullet(b) {
    var br = { x1: b.x, y1: b.y, x2: b.x + BULLET, y2: b.y + BULLET };
    for (var i = 0; i < bullets.length; i++) {
      var o = bullets[i];
      if (o === b || o.dead || o.owner === b.owner) continue;
      if (aabb(br, { x1: o.x, y1: o.y, x2: o.x + BULLET, y2: o.y + BULLET })) {
        b.dead = true; o.dead = true; spawnHit(b); return true;
      }
    }
    return false;
  }

  function hitEnemy(e) {
    e.hp--;
    if (e.hp <= 0) {
      e.alive = false;
      score += e.pts;
      explode(e.x + TANK / 2, e.y + TANK / 2, '#ffb03a', 26);
      sfxExplode();
    } else {
      spawnHitAt(e.x + TANK / 2, e.y + TANK / 2);
      sfxHit();
    }
  }
  function hitPlayer() {
    if (!player || player.invuln > 0 || !player.alive) return;
    player.alive = false;
    lives--;
    explode(player.x + TANK / 2, player.y + TANK / 2, '#ffd76a', 26);
    sfxExplode();
    if (lives <= 0) { pendingGameOver = true; gameOverTimer = 80; gameOverReason = '生命耗尽'; }
    else respawnTimer = 70;
  }
  function destroyBase() {
    BASE.alive = false;
    explode(BASE.x * CELL + CELL / 2, BASE.y * CELL + CELL / 2, '#ff5a3a', 40);
    sfxExplode();
    pendingGameOver = true; gameOverTimer = 80; gameOverReason = '基地被摧毁';
  }

  // ===== 粒子 =====
  function spawnHit(b) { spawnHitAt(b.x + BULLET / 2, b.y + BULLET / 2); }
  function spawnHitAt(x, y) {
    for (var i = 0; i < 8; i++) {
      var a = Math.random() * Math.PI * 2, sp = randInt(20, 70);
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: randInt(10, 20), maxLife: 20, color: '#ffd76a', size: 3 });
    }
  }
  function explode(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = randInt(30, 140);
      particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: randInt(15, 35), maxLife: 35, color: (Math.random() < 0.5 ? color : '#ffffff'), size: randInt(2, 6) });
    }
  }
  function updateParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx * STEP; p.y += p.vy * STEP;
      p.life--;
    }
    particles = particles.filter(function (p) { return p.life > 0; });
  }

  // ===== 敌军 AI =====
  function pickDir(e) {
    if (Math.random() < 0.35) return randInt(0, 3);
    var px = (player && player.alive) ? player.x + TANK / 2 : BASE.x * CELL + CELL / 2;
    var py = (player && player.alive) ? player.y + TANK / 2 : BASE.y * CELL + CELL / 2;
    var dx = px - (e.x + TANK / 2), dy = py - (e.y + TANK / 2);
    if (Math.abs(dx) >= Math.abs(dy)) return dx > 0 ? DIR.RIGHT : DIR.LEFT;
    return dy > 0 ? DIR.DOWN : DIR.UP;
  }
  function updateEnemy(e) {
    if (e.spawning) { e.spawnTimer--; if (e.spawnTimer <= 0) e.spawning = false; return; }
    e.cooldown = Math.max(0, e.cooldown - 1);
    e.think--;
    if (e.think <= 0 || e.blocked) { e.pendingDir = pickDir(e); e.think = randInt(70, 180); }
    e.blocked = false;
    if (e.pendingDir != null) {
      if (e.pendingDir === e.dir) e.pendingDir = null;
      else if (canTurn(e, e.pendingDir)) { e.dir = e.pendingDir; e.pendingDir = null; }
    }
    if (e.cooldown === 0 && shouldShoot(e)) { fireBullet(e); e.cooldown = randInt(45, 100); }
    if (!moveTank(e)) e.blocked = true;
  }
  function handleSpawning() {
    if (enemyQueue.length === 0) return;
    if (enemies.filter(function (e) { return e.alive; }).length >= 3) return;
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnTimer = spawnEnemy() ? 45 : 15;
    }
  }
  function spawnEnemy() {
    if (enemyQueue.length === 0) return false;
    var pts = [{ x: 0, y: 0 }, { x: 6, y: 0 }, { x: 12, y: 0 }];
    for (var i = 0; i < pts.length; i++) {
      var px = pts[i].x * CELL + TANK_OFF, py = pts[i].y * CELL + TANK_OFF;
      if (spawnPointFree(px, py)) {
        enemies.push(makeEnemy(px, py, enemyQueue.shift()));
        return true;
      }
    }
    return false;
  }

  // ===== 输入 =====
  var keys = { up: false, down: false, left: false, right: false, fire: false };
  var KEYMAP = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', Space: 'fire'
  };
  window.addEventListener('keydown', function (e) {
    if (e.code in KEYMAP) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.code in KEYMAP) keys[KEYMAP[e.code]] = false;
  });
  function readDirection() {
    if (keys.up) return DIR.UP;
    if (keys.down) return DIR.DOWN;
    if (keys.left) return DIR.LEFT;
    if (keys.right) return DIR.RIGHT;
    return null;
  }

  // ===== 更新 =====
  function updatePlayer() {
    if (pendingGameOver) return;
    player.cooldown = Math.max(0, player.cooldown - 1);
    player.invuln = Math.max(0, player.invuln - 1);
    var d = readDirection();
    if (d != null) {
      if (d !== player.dir && canTurn(player, d)) player.dir = d;
      moveTank(player);
    }
    if (keys.fire && player.cooldown === 0) { fireBullet(player); player.cooldown = 12; }
  }
  function updateBullets() {
    for (var i = 0; i < bullets.length; i++) {
      var b = bullets[i];
      if (b.dead) continue;
      b.x += DX[b.dir] * b.speed;
      b.y += DY[b.dir] * b.speed;
      if (b.x < 0 || b.y < 0 || b.x + BULLET > W || b.y + BULLET > H) { b.dead = true; continue; }
      if (bulletHitsTerrain(b)) continue;
      if (bulletHitsTank(b)) continue;
      bulletHitsBullet(b);
    }
    bullets = bullets.filter(function (b) { return !b.dead; });
  }
  function update() {
    animT += STEP;
    if (levelIntroTimer > 0) levelIntroTimer--;
    if (pendingGameOver) {
      gameOverTimer--;
      if (gameOverTimer <= 0) endGame(gameOverReason);
      updateBullets(); updateParticles();
      return;
    }
    if (player.alive) updatePlayer();
    else if (respawnTimer > 0) { respawnTimer--; if (respawnTimer <= 0) respawnPlayer(); }
    for (var i = 0; i < enemies.length; i++) if (enemies[i].alive) updateEnemy(enemies[i]);
    updateBullets();
    updateParticles();
    handleSpawning();
    enemies = enemies.filter(function (e) { return e.alive; });
    if (enemies.length === 0 && enemyQueue.length === 0) { level++; startLevel(level); }
  }

  // ===== 渲染 =====
  function drawBrick(px, py, cx, cy) {
    ctx.fillStyle = '#b06a2a'; ctx.fillRect(px, py, CELL, CELL);
    ctx.strokeStyle = '#7a4416'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(px, py + CELL / 2); ctx.lineTo(px + CELL, py + CELL / 2); ctx.stroke();
    ctx.beginPath();
    var i;
    for (i = 0; i < 2; i++) { var x = px + (i + 0.5) * CELL; ctx.moveTo(x, py); ctx.lineTo(x, py + CELL / 2); }
    for (i = 0; i < 2; i++) { x = px + i * CELL; ctx.moveTo(x, py + CELL / 2); ctx.lineTo(x, py + CELL); }
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(px, py, CELL, 3);
    if (brickHp[cy][cx] <= 1) {
      ctx.strokeStyle = '#3a1f08'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(px + 4, py + 4); ctx.lineTo(px + CELL - 4, py + CELL - 4);
      ctx.moveTo(px + CELL - 4, py + 4); ctx.lineTo(px + 4, py + CELL - 4);
      ctx.stroke();
    }
  }
  function drawSteel(px, py) {
    ctx.fillStyle = '#9aa4ad'; ctx.fillRect(px + 1, py + 1, CELL - 2, CELL - 2);
    ctx.strokeStyle = '#4c555e'; ctx.lineWidth = 2; ctx.strokeRect(px + 2, py + 2, CELL - 4, CELL - 4);
    ctx.fillStyle = '#c4cdd6'; ctx.fillRect(px + 4, py + 4, CELL - 8, 4);
  }
  function drawWater(px, py) {
    ctx.fillStyle = '#17506e'; ctx.fillRect(px, py, CELL, CELL);
    ctx.fillStyle = '#2f83b0';
    var off = (animT * 24) % (CELL * 2);
    for (var k = -1; k < 2; k++) {
      var y = py + k * CELL + off;
      if (y < py) y += CELL * 2;
      if (y >= py + CELL) y -= CELL * 2;
      ctx.fillRect(px, y, CELL, 3);
    }
  }
  function drawTree(px, py) {
    ctx.fillStyle = '#1f5c28';
    ctx.beginPath();
    ctx.arc(px + 12, py + 16, 10, 0, 7);
    ctx.arc(px + 28, py + 12, 11, 0, 7);
    ctx.arc(px + 20, py + 26, 12, 0, 7);
    ctx.arc(px + 30, py + 28, 9, 0, 7);
    ctx.fill();
    ctx.fillStyle = '#2f7a33';
    ctx.beginPath(); ctx.arc(px + 18, py + 18, 9, 0, 7); ctx.arc(px + 26, py + 24, 8, 0, 7); ctx.fill();
  }
  function drawBase() {
    var px = BASE.x * CELL, py = BASE.y * CELL;
    if (!BASE.alive) {
      ctx.fillStyle = '#3a3f46'; ctx.fillRect(px, py, CELL, CELL);
      ctx.strokeStyle = '#22262b'; ctx.lineWidth = 2; ctx.strokeRect(px + 2, py + 2, CELL - 4, CELL - 4);
      ctx.strokeStyle = '#16191d'; ctx.beginPath();
      ctx.moveTo(px + 6, py + 6); ctx.lineTo(px + CELL - 6, py + CELL - 6);
      ctx.moveTo(px + CELL - 6, py + 6); ctx.lineTo(px + 6, py + CELL - 6);
      ctx.stroke();
      return;
    }
    ctx.fillStyle = '#8a8f96'; ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
    ctx.strokeStyle = '#3f444a'; ctx.lineWidth = 2; ctx.strokeRect(px + 2, py + 2, CELL - 4, CELL - 4);
    ctx.fillStyle = '#e6edf3'; ctx.fillRect(px + 10, py + 9, 3, 20);
    ctx.fillStyle = '#d22b2b';
    ctx.beginPath(); ctx.moveTo(px + 13, py + 9); ctx.lineTo(px + 29, py + 15); ctx.lineTo(px + 13, py + 21); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffd76a';
    ctx.beginPath(); ctx.moveTo(px + 18, py + 12); ctx.lineTo(px + 21, py + 15); ctx.lineTo(px + 18, py + 18); ctx.lineTo(px + 15, py + 15); ctx.closePath(); ctx.fill();
  }
  function drawTank(x, y, dir, body, accent, track) {
    ctx.save();
    ctx.translate(x + TANK / 2, y + TANK / 2);
    ctx.rotate(dir * Math.PI / 2);
    var w = TANK, h = TANK;
    ctx.fillStyle = track;
    ctx.fillRect(-w / 2, -h / 2, 7, h);
    ctx.fillRect(w / 2 - 7, -h / 2, 7, h);
    ctx.fillStyle = '#26262a';
    for (var i = -h / 2 + 3; i < h / 2; i += 6) {
      ctx.fillRect(-w / 2 + 1, i, 5, 2);
      ctx.fillRect(w / 2 - 6, i, 5, 2);
    }
    ctx.fillStyle = body;
    ctx.fillRect(-w / 2 + 7, -h / 2 + 3, w - 14, h - 6);
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    ctx.fillRect(-w / 2 + 7, -h / 2 + 3, w - 14, 3);
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillRect(-2.5, -h / 2, 5, 14);
    ctx.restore();
  }
  function drawSpawnStar(x, y) {
    var t = animT * 6;
    ctx.save();
    ctx.translate(x, y); ctx.rotate(t);
    ctx.fillStyle = (Math.floor(t * 4) % 2 === 0) ? '#ffffff' : '#ffd76a';
    var s = 8 + Math.sin(t) * 3;
    ctx.beginPath();
    for (var i = 0; i < 8; i++) {
      var r = (i % 2 === 0) ? s : s * 0.4;
      var a = i * Math.PI / 4;
      var vx = Math.cos(a) * r, vy = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0e13'; ctx.fillRect(0, 0, W, H);
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        var t = grid[y][x], px = x * CELL, py = y * CELL;
        if (t === T_BRICK) drawBrick(px, py, x, y);
        else if (t === T_STEEL) drawSteel(px, py);
        else if (t === T_WATER) drawWater(px, py);
      }
    }
    drawBase();

    if (player) {
      if (player.alive && !(player.invuln > 0 && Math.floor(animT * 12) % 2 === 0))
        drawTank(player.x, player.y, player.dir, '#e8b53a', '#4a7a3a', '#3a3a3a');
      for (var i = 0; i < enemies.length; i++) {
        var e = enemies[i];
        if (!e.alive) continue;
        if (e.spawning) drawSpawnStar(e.x + TANK / 2, e.y + TANK / 2);
        else drawTank(e.x, e.y, e.dir, e.color, e.accent, '#3a3a3a');
      }
    }

    ctx.save();
    for (var j = 0; j < bullets.length; j++) {
      var b = bullets[j];
      ctx.fillStyle = b.owner === 'player' ? '#ffe27a' : '#ff9d5c';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 6;
      ctx.fillRect(b.x, b.y, BULLET, BULLET);
    }
    ctx.restore();

    for (var k = 0; k < particles.length; k++) {
      var p = particles[k];
      ctx.globalAlpha = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    for (var yy = 0; yy < GRID; yy++)
      for (var xx = 0; xx < GRID; xx++)
        if (grid[yy][xx] === T_TREE) drawTree(xx * CELL, yy * CELL);

    if (state === 'playing' && levelIntroTimer > 0) {
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      ctx.fillRect(0, H / 2 - 40, W, 80);
      ctx.fillStyle = '#ffd76a';
      ctx.font = 'bold 34px "Segoe UI", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('LEVEL ' + level, W / 2, H / 2);
      ctx.textAlign = 'start'; ctx.textBaseline = 'alphabetic';
    }

    updateHUD();
  }
  function updateHUD() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    enemiesEl.textContent = enemyQueue.length + enemies.filter(function (e) { return e.alive; }).length;
    livesEl.textContent = Math.max(0, lives);
  }

  // ===== 界面 =====
  function showMenu() {
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = '坦克大战';
    overlay.querySelector('p').innerHTML =
      '守住你的基地，消灭所有来犯坦克！<br>' +
      '移动：<span class="keys">WASD / 方向键</span>　射击：<span class="keys">空格</span><br>' +
      '砖墙可击毁 · 钢墙不可摧毁 · 躲进树林可伏击敌人';
    startBtn.textContent = '开始游戏';
  }
  startBtn.addEventListener('click', function () {
    audio();
    resetGame();
    startLevel(1);
    overlay.classList.add('hidden');
    startBtn.blur();
  });
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.blur();
  });

  // ===== 主循环 =====
  var last = performance.now(), acc = 0;
  function frame(now) {
    acc += (now - last) / 1000; last = now;
    if (acc > 0.25) acc = 0.25;
    while (acc >= STEP) { if (state === 'playing') update(); acc -= STEP; }
    render();
    requestAnimationFrame(frame);
  }

  // ===== 初始化 =====
  loadLevel(0);
  BASE.alive = true;
  updateHUD();
  showMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
